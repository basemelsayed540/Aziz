<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إدارة الشحنات</title>
  <script type="text/javascript">
    (function () {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // GitHub Pages SPA redirect: preserve full URL and redirect to index.html
      var redirect = '/' +
        (search
          ? '?' + search.slice(1).replace(/&/g, '~and~')
          : '?/' + encodeURIComponent(path.replace(/^\/+/, ''))
        ) +
        (hash || '');

      window.location.replace(redirect);
    })();
  </script>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #121212;
      color: #94a3b8;
      font-family: system-ui, sans-serif;
      direction: rtl;
    }
    .msg { text-align: center; padding: 2rem; }
    .msg h1 { color: #e2e8f0; font-size: 1.5rem; margin-bottom: 0.5rem; }
    .msg p { font-size: 0.875rem; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="msg">
    <div class="spinner"></div>
    <h1>جاري تحميل التطبيق...</h1>
    <p>سيتم إعادة توجيهك تلقائياً</p>
  </div>
</body>
</html>
